name: Build and publish apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          props = dict(line.strip().split('=', 1) for line in open('version.properties') if '=' in line)
          version = props['versionName']
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?', version), 'Invalid version'
          assert int(props['versionCode']) > 0
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == 'v' + version, 'Tag must match version.properties'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('version=' + version + '\n')
              out.write('prerelease=' + str(version.startswith('0.') or '-' in version).lower() + '\n')
          PY

  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Test, lint and build Android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/xshifter-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          python3 - <<'PY'
          import os, base64
          keys = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          assert all(os.environ.get(k) for k in keys), 'Configure the four ANDROID signing secrets before tagging a release'
          fd = os.open(os.environ['ANDROID_KEYSTORE_PATH'], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'wb') as out:
              out.write(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          PY
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/XShifter-Open-${{ needs.version.outputs.version }}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/"*.apk
      - name: Collect debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/XShifter-Open-${{ needs.version.outputs.version }}-debug.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-app
          path: dist/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-checks
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 14

  macos:
    needs: version
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test protocol and calibration workflow
        run: ./macos/test.sh
      - name: Build universal native Mac app
        run: ./macos/build.sh
      - name: Package Mac app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "macos/build/XShifter Open.app" "dist/XShifter-Open-${{ needs.version.outputs.version }}-macOS-universal.zip"
          lipo -info "macos/build/XShifter Open.app/Contents/MacOS/XShifterOpen"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app
          path: dist/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, android, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-app'
          merge-multiple: true
          path: dist
      - name: Publish versioned downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.apk ./*.zip > SHA256SUMS
          EXTRA_FLAGS=()
          if [ "$PRERELEASE" = true ]; then EXTRA_FLAGS+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "XShifter Open $RELEASE_TAG" \
            --generate-notes "${EXTRA_FLAGS[@]}" \
            --notes 'Android APK and universal macOS app (Apple Silicon + Intel, macOS 13+). Mac app is ad-hoc signed, not Apple-notarized. Android release APKs use a stable private release key; earlier locally signed debug builds may need profile export and replacement. Hardware calibration and firmware compatibility still require testing on your own XShifter. No vendor firmware images are included.' \
            ./*.apk ./*.zip SHA256SUMS
